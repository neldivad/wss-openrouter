# The model catalogue with per-token prices and context limits. OpenRouter
# serves only the current catalogue: yesterday's price list is gone, and
# models are removed outright when providers retire them.
source_id: openrouter.models.catalog
status: active
cadence: weekly
schema_id: or-catalog.v1

publisher: OpenRouter
publisher_tier: redistribution
destroys_own_history: true
licence: "public API; see https://openrouter.ai/terms"
personal_data: none
storage: git

notes: >-
  A price index for inference, plus `hugging_face_id` on ~180 of 417 models —
  the join key to wss-hugging-face, letting downloads (stated interest) be
  compared against token volume (revealed use) for the same model.

endpoints:
  - url: "https://openrouter.ai/api/v1/models"
    delay_seconds: 2

gates:
  expect_status: 200
  min_bytes: 200000
  content_type_any: [json]
  must_contain: ["pricing"]
  must_not_contain: ["Access Denied"]
  # 50%: derived from observed volatility, not taste. Across the fleet's
  # manifest history no source has ever shrunk more than 2.3% between
  # captures, so 50 is ~20x the worst real movement while still catching
  # truncation. Set high on purpose: the baseline is the LAST SUCCESSFUL
  # capture, so a gate that fires on a legitimate change keeps firing
  # forever against a size the publisher has moved on from, and every
  # capture in between is lost. Capture must not fail; health flags an
  # odd source AFTER the bytes are safely stored.
  max_shrink_pct: 50
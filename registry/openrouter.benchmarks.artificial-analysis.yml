# Current benchmark scores. No date window exists on this endpoint, so only
# today's scores are ever available — the history of how a model's score
# moved is destroyed.
source_id: openrouter.benchmarks.artificial-analysis
status: active
cadence: weekly
schema_id: or-benchmarks.v1

publisher: OpenRouter
publisher_tier: redistribution
destroys_own_history: true
licence: "CC BY 4.0 via OpenRouter; scores originate with Artificial Analysis (artificialanalysis.ai)"
personal_data: none
storage: git

notes: >-
  Composite intelligence, coding and agentic indices. Paired with openrouter.models.catalog prices, this turns a
  cost-versus-capability scatter into a time series.

auth:
  bearer_env: OPENROUTER_API_KEY

endpoints:
  - url: "https://openrouter.ai/api/v1/benchmarks?source=artificial-analysis&max_results=100"
    delay_seconds: 2

gates:
  expect_status: 200
  min_bytes: 1000
  content_type_any: [json]
  must_contain: ["model_permaslug"]
  must_not_contain: ["Access Denied"]
  # 50%: derived from observed volatility, not taste. Across the fleet's
  # manifest history no source has ever shrunk more than 2.3% between
  # captures, so 50 is ~20x the worst real movement while still catching
  # truncation. Set high on purpose: the baseline is the LAST SUCCESSFUL
  # capture, so a gate that fires on a legitimate change keeps firing
  # forever against a size the publisher has moved on from, and every
  # capture in between is lost. Capture must not fail; health flags an
  # odd source AFTER the bytes are safely stored.
  max_shrink_pct: 50